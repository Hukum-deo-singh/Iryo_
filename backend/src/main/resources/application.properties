spring.application.name=iryo-backend
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Database (Aiven PostgreSQL). All three are required.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# The schema belongs to Flyway. Hibernate only checks that it matches.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Never leak internals in error responses.
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Security. JWT_SECRET must be at least 32 characters. ADMIN_API_KEY empty = provisioning disabled.
iryo.jwt.secret=${JWT_SECRET}
iryo.jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:720}
iryo.admin.api-key=${ADMIN_API_KEY:}
iryo.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# How long a device stays linked to a user before it becomes free again.
iryo.assignment.minutes=${DEVICE_ASSIGNMENT_MINUTES:2}

# PROVISIONAL health thresholds. Not clinically reviewed. See docs/DERIVED_DATA_RULES.md.
iryo.thresholds.spo2-normal=95
iryo.thresholds.spo2-urgent=90
iryo.thresholds.temp-low-urgent=35.0
iryo.thresholds.temp-low-attention=36.0
iryo.thresholds.temp-high-attention=37.5
iryo.thresholds.temp-high-urgent=38.0
